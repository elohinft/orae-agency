/* ORAE — NEW ERA
   Valeurs issues de la maquette Figma (cadre 1440 px). */

:root {
  --bg: #e7e7e7;
  --ink: #141212;
  --ink-soft: rgba(20, 18, 18, .7);
  --red: #f70010;

  --font-text: "Inter", system-ui, sans-serif;
  --font-body: "Inter", system-ui, sans-serif;
  --font-display: Helvetica, "Helvetica Neue", Arial, sans-serif;

  --edge: 12px;                          /* marge nav / footer */
  --gutter: clamp(20px, 5vw, 72px);      /* marge du contenu */
}

*,
*::before,
*::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-text);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

main { flex: 1; }

p, h1, h2, h3, ul { margin: 0; }
ul { padding: 0; list-style: none; }

a { color: inherit; text-decoration: none; }
a:hover { opacity: .6; }
a:focus-visible { outline: 1px solid currentColor; outline-offset: 3px; }

/* ---------- Navigation ---------- */

.nav {
  height: 52px;
  margin: 0 var(--edge);
  padding: 0 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: #141212;
  white-space: nowrap;
}

.nav__brand { display: flex; align-items: center; gap: 8px; }
.nav__wordmark { font-size: 13px; font-weight: 700; }
.nav__mark { font-size: 11px; color: var(--ink-soft); }

.nav__menu {
  display: flex;
  align-items: center;
  gap: clamp(14px, 2.78vw, 40px);
  font-size: 13px;
  font-weight: 500;
}


.roll {
  display: block;
  overflow: hidden;
  height: 1.3em;
  line-height: 1.3em;
}

.roll > span {
  display: block;
  transition: transform .45s cubic-bezier(.6, 0, .2, 1);
}

a:hover .roll > span,
button:hover .roll > span { transform: translateY(-100%); }

/* ---------- Menu mobile (burger asymétrique) ---------- */

.nav__burger,
.menu { display: none; }

@media (max-width: 760px) {
  body { padding-top: 52px; }
  .about, .services, .contact, .trail { scroll-margin-top: 64px; }

  .nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 120;
    margin: 0;
    padding: 0 20px;
    background: var(--bg);
  }

  .nav__menu { display: none; }

  .nav__burger {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    justify-content: center;
    gap: 5px;
    width: 40px;
    height: 40px;
    margin-right: -8px;
    padding: 0 8px;
    border: 0;
    background: none;
    cursor: pointer;
  }

  .nav__burger span {
    display: block;
    height: 1.5px;
    border-radius: 1px;
    background: var(--ink);
    transition: transform .4s cubic-bezier(.6, 0, .2, 1), width .4s cubic-bezier(.6, 0, .2, 1), opacity .3s;
  }

  .nav__burger span:nth-child(1) { width: 22px; }
  .nav__burger span:nth-child(2) { width: 12px; }
  .nav__burger span:nth-child(3) { width: 17px; }

  .nav__burger[aria-expanded="true"] span:nth-child(1) { width: 20px; transform: translateY(6.5px) rotate(45deg); }
  .nav__burger[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
  .nav__burger[aria-expanded="true"] span:nth-child(3) { width: 20px; transform: translateY(-6.5px) rotate(-45deg); }

  .menu {
    position: fixed;
    inset: 0;
    z-index: 110;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 84px 24px 34px;
    background: var(--bg);
    visibility: hidden;
    clip-path: inset(0 0 100% 0);
    transition: clip-path .6s cubic-bezier(.7, 0, .2, 1), visibility 0s .6s;
  }

  .menu.is-open {
    visibility: visible;
    clip-path: inset(0 0 0 0);
    transition: clip-path .6s cubic-bezier(.7, 0, .2, 1), visibility 0s;
  }

  .menu__links { display: flex; flex-direction: column; border-top: 1px solid rgba(0, 0, 0, .18); }

  .menu__links a {
    display: flex;
    align-items: baseline;
    gap: 16px;
    padding: 18px 0 20px;
    border-bottom: 1px solid rgba(0, 0, 0, .18);
    font-family: var(--font-display);
    font-size: clamp(28px, 8.4vw, 42px);
    font-weight: 700;
    line-height: 1.05;
    letter-spacing: -.03em;
    opacity: 0;
    transform: translateY(18px);
    transition: opacity .45s, transform .6s cubic-bezier(.3, 1, .4, 1);
  }

  .menu__links a i {
    font-family: var(--font-text);
    font-size: 11px;
    font-style: normal;
    font-weight: 500;
    letter-spacing: 0;
    color: var(--ink-soft);
  }

  .menu.is-open .menu__links a { opacity: 1; transform: none; }
  .menu.is-open .menu__links a:nth-child(1) { transition-delay: .18s; }
  .menu.is-open .menu__links a:nth-child(2) { transition-delay: .24s; }
  .menu.is-open .menu__links a:nth-child(3) { transition-delay: .30s; }
  .menu.is-open .menu__links a:nth-child(4) { transition-delay: .36s; }

  .menu__links a:hover,
  .menu__foot a:hover { opacity: 1; }
  .menu__links a:active { color: var(--red); }

  .menu__foot {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding-top: 22px;
    border-top: 1px solid rgba(0, 0, 0, .2);
    font-size: 15px;
    font-weight: 500;
    opacity: 0;
    transition: opacity .4s;
  }

  .menu.is-open .menu__foot { opacity: 1; transition-delay: .45s; }
  .menu__foot small { margin-top: 10px; font-size: 11px; font-weight: 500; text-transform: uppercase; color: var(--ink-soft); }
}

@media (prefers-reduced-motion: reduce) {
  .menu, .menu__links a, .menu__foot, .nav__burger span { transition: none; }
}

/* ---------- Footer ---------- */

.footer {
  height: 52px;
  margin: 0 var(--edge) 30px;
  padding: 0 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11px;
  color: var(--ink-soft);
  white-space: nowrap;
}

.footer__legal { display: flex; gap: 24px; }

/* ---------- Contact rapide (pill téléphone + email) ---------- */

.quick {
  position: fixed;
  left: 50%;
  bottom: 20px;
  z-index: 60;
  display: flex;
  flex-direction: row;
  align-items: center;
  padding: 5px;
  border-radius: 999px;
  background: var(--ink);
  color: #fff;
  box-shadow: 0 10px 30px rgba(0, 0, 0, .16), inset 0 0 0 1px rgba(255, 255, 255, .08);
  transform: translateX(-50%);
}

.quick__item { position: relative; display: flex; align-items: center; }

/* fine séparation entre les deux boutons */
.quick__item + .quick__item::before {
  content: "";
  position: absolute;
  left: 0;
  top: 50%;
  width: 1px;
  height: 20px;
  background: currentColor;
  opacity: .22;
  transform: translateY(-50%);
  pointer-events: none;
}

.quick__btn {
  width: 54px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: inherit;
  cursor: pointer;
  transition: background .25s;
}

.quick__btn:focus-visible { outline: 2px solid currentColor; outline-offset: -2px; }

.quick__btn svg {
  width: 20px;
  height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.quick__menu {
  position: absolute;
  left: 50%;
  bottom: calc(100% + 14px);
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 5px;
  border-radius: 22px;
  background: var(--ink);
  color: #fff;
  box-shadow: 0 10px 30px rgba(0, 0, 0, .16), inset 0 0 0 1px rgba(255, 255, 255, .08);
  opacity: 0;
  visibility: hidden;
  transform: translate(-50%, 10px) scale(.96);
  transform-origin: center bottom;
  transition: opacity .25s, transform .35s cubic-bezier(.3, 1.3, .4, 1), visibility .25s;
}

.quick__item.is-open .quick__menu {
  opacity: 1;
  visibility: visible;
  transform: translate(-50%, 0) scale(1);
}

.quick__menu a {
  display: block;
  padding: 10px 20px;
  border-radius: 999px;
  color: inherit;
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
  transition: background .25s;
}

.quick__menu a:hover { opacity: 1; background: rgba(127, 127, 127, .25); }

@media (max-width: 640px) {
  .quick { bottom: 14px; }
}

@media (prefers-reduced-motion: reduce) {
  .quick__btn, .quick__menu { transition: none; }
}

/* fenêtre de détail d'un projet */
.pj { position: fixed; inset: 0; z-index: 1000; display: none; align-items: center; justify-content: center; padding: clamp(12px, 3vw, 32px); background: rgba(0, 0, 0, .86); opacity: 0; transition: opacity .3s; }
.pj.is-on { display: flex; }
.pj.is-show { opacity: 1; }
.pj__panel { position: relative; display: grid; grid-template-columns: 1.1fr 1fr; width: min(1080px, 100%); height: min(660px, 100%); background: #0d0d0d; color: #f4f4f0; border-radius: 6px; overflow: hidden; transform: translateY(14px) scale(.98); transition: transform .35s cubic-bezier(.2, .9, .3, 1); }
.pj.is-show .pj__panel { transform: none; }
.pj__viewer { min-height: 0; overflow-y: auto; padding: 16px; background: #181818; overscroll-behavior: contain; }
.pj__win { overflow: hidden; border-radius: 6px; background: #fff; }
.pj__bar { display: flex; align-items: center; gap: 5px; height: 24px; padding: 0 10px; background: #2a2a2a; }
.pj__bar i { width: 7px; height: 7px; border-radius: 50%; background: #5a5a5a; }
.pj__win--img .pj__bar { display: none; }
.pj__win--img { display: flex; flex-direction: column; gap: 12px; background: transparent; }
.pj__win--img #pjImgs { display: flex; flex-direction: column; gap: 12px; }
.pj__win--img img { border-radius: 4px; }
.pj__viewer img { display: block; width: 100%; height: auto; }
.pj__info { display: flex; flex-direction: column; gap: 20px; min-height: 0; overflow-y: auto; padding: 44px 40px 36px; }
.pj__type { margin: 0; font-size: 11px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: rgba(244, 244, 240, .55); }
.pj__title { margin: 0; font-family: var(--font-display); font-size: clamp(28px, 3.2vw, 38px); font-weight: 600; line-height: 1.05; letter-spacing: -.02em; }
.pj__desc { margin: 0; font-size: 14px; line-height: 1.65; color: rgba(244, 244, 240, .8); }
.pj__list { margin: 0; border-top: 1px solid rgba(244, 244, 240, .18); }
.pj__list div { display: grid; grid-template-columns: 100px 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px solid rgba(244, 244, 240, .18); font-size: 13px; }
.pj__list dt { color: rgba(244, 244, 240, .55); }
.pj__list dd { margin: 0; }
.pj__cta { align-self: flex-start; margin-top: auto; padding: 12px 20px; border-radius: 99px; background: #f4f4f0; color: #141212; font-size: 13px; font-weight: 500; text-decoration: none; }
.pj__close:focus, .pj__close:focus-visible { outline: none; box-shadow: none; }
.pj__close { -webkit-tap-highlight-color: transparent; position: absolute; top: 12px; right: 12px; z-index: 3; width: 34px; height: 34px; border: 0; border-radius: 50%; background: #f4f4f0; color: #141212; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; }
@media (max-width: 760px) {
  .pj__panel { grid-template-columns: 1fr; grid-template-rows: 42% 1fr; }
  .pj__info { padding: 22px 20px; gap: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  .roll > span { transition: none; }
  html { scroll-behavior: auto; }
}

.hero__title {
  /* Tout le bloc titre est dimensionné en em : 1em = 178 px sur 1440 */
  position: relative;
  margin: clamp(72px, 9.1vw, 175px) var(--gutter) 0;
  font-family: var(--font-display);
  font-size: clamp(40px, 12.361vw, 238px);
  font-weight: 700;
  line-height: .9;
  text-align: center;
}

.hero__line { display: block; white-space: nowrap; }
.hero__line + .hero__line { margin-top: -.0955em; }

.hero__script {
  position: absolute;
  left: 50%;
  top: 1.44em;
  width: 4.118em;                        /* 660 unités = .624em × 6.6 */
  height: auto;
  transform: translateX(-50%);
  overflow: visible;
  cursor: pointer;
}

.hero__script-text { fill: var(--red); }

/* Coups de feutre : chaque trait révèle le lettrage, bord net, sans fondu */
.pen-strokes path {
  stroke-dasharray: 1 2;
  stroke-dashoffset: 1;
}

.is-drawing .pen-strokes path {
  animation: stroke .26s var(--d, 0s) cubic-bezier(.3, .6, .4, 1) forwards;
}

@keyframes stroke { to { stroke-dashoffset: 0; } }

/* Contact rapide : pill claire sur fond sombre */
.quick { background: #e7e7e7; color: #141212; box-shadow: 0 10px 30px rgba(0, 0, 0, .35), inset 0 0 0 1px rgba(0, 0, 0, .06); }
.quick__menu { background: #e7e7e7; color: #141212; box-shadow: 0 10px 30px rgba(0, 0, 0, .35), inset 0 0 0 1px rgba(0, 0, 0, .06); }

/* Fenêtre de détail en clair sur la page sombre */
.pj { background: rgba(0, 0, 0, .7); }
.pj__panel { background: #e7e7e7; color: #141212; }
.pj__viewer { background: #d6d6d6; }
.pj__bar { background: #dcdcd6; }
.pj__bar i { background: #b9b9b2; }
.pj__type { color: rgba(10, 10, 10, .55); }
.pj__desc { color: rgba(10, 10, 10, .78); }
.pj__list { border-top-color: rgba(10, 10, 10, .18); }
.pj__list div { border-bottom-color: rgba(10, 10, 10, .18); }
.pj__list dt { color: rgba(10, 10, 10, .55); }
.pj__cta { background: #141212; color: #f4f4f0; }
.pj__close { background: #141212; color: #f4f4f0; }

/* ---------- Page Projets (fond sombre) ---------- */
:root { --bg: #141212; --ink: #f4f4f0; --ink-soft: rgba(244, 244, 240, .6); --line: rgba(244, 244, 240, .16); }
body { background: var(--bg); color: var(--ink); }
.nav { color: var(--ink); }
.nav__brand, .nav__menu a { color: var(--ink); }
.footer, .footer a { color: var(--ink); }
.pg__hero { padding-bottom: 0; }
.pg__hero .hero__title { margin-top: clamp(72px, 9.1vw, 175px); }
.pg__label { font-size: 11px; font-weight: 500; line-height: 15px; text-transform: uppercase; color: var(--ink-soft); }
.pg__label--r { text-align: right; }
.pg__title { font-family: var(--font-display); font-size: clamp(54px, 13vw, 200px); font-weight: 500; line-height: .9; letter-spacing: -.045em; }
.pg__jump { margin: clamp(30px, 4vw, 56px) var(--gutter) 40px; justify-content: center; display: flex; flex-wrap: wrap; gap: 8px 24px; font-size: 13px; }
.pg__jump a { color: var(--ink-soft); border-bottom: 1px solid transparent; }
.pg__jump a:hover { opacity: 1; color: var(--ink); border-color: var(--ink); }
.ix { margin: 0 var(--gutter); }
.ix__cat { margin-bottom: clamp(36px, 6vw, 84px); scroll-margin-top: 20px; }
.ix__head { border-top: 1px solid var(--line); padding-block: 22px 14px; display: grid; grid-template-columns: 90px 1fr minmax(0, 320px); gap: 12px 24px; align-items: baseline; }
.ix__head h2 { grid-column: 2; font-family: var(--font-display); font-weight: 500; font-size: clamp(30px, 5.4vw, 80px); letter-spacing: -.035em; line-height: 1; }
.ix__head p { font-size: 13px; line-height: 1.55; color: var(--ink-soft); }
.ix__row { width: 100%; display: grid; grid-template-columns: 90px 1.4fr 1fr 110px 44px; gap: 12px; align-items: center; padding: 14px 0; border: 0; border-top: 1px solid var(--line); background: none; color: inherit; font: inherit; font-size: 15px; text-align: left; cursor: pointer; transition: padding .3s; }
.ix__row:hover, .ix__row:focus-visible { padding-left: 14px; outline: none; }
.ix__row--soon, .ix__row--soon:hover { cursor: default; padding-left: 0; }
.ix__row:focus-visible .ix__name { text-decoration: underline; text-underline-offset: 5px; }
.ix__thumb { justify-self: end; width: 44px; height: 30px; border-radius: 0; overflow: hidden; background: rgba(20,18,18,.06); }
.ix__thumb img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top center; }
.ix__num { font-size: 11px; font-weight: 500; letter-spacing: .06em; color: var(--ink-soft); }
.ix__name { font-weight: 500; }
.ix__type, .ix__count { color: var(--ink-soft); }
.ix__cat > .ix__row:last-child { border-bottom: 1px solid var(--line); }
.follow { position: fixed; left: 0; top: 0; width: clamp(180px, 20vw, 280px); pointer-events: none; z-index: 40; opacity: 0; transition: opacity .2s; will-change: transform; }
.follow.on { opacity: 1; }
.follow img { display: block; width: 100%; height: auto; border-radius: 2px; }
@media (hover: none) { .follow { display: none; } .ix__row:hover { padding-left: 0; } }
@media (max-width: 760px) {
  .follow { display: none; }
  .pg__jump { gap: 6px 18px; font-size: 12px; margin-bottom: 28px; }
  .ix { margin: 0 var(--gutter); }
  .ix__head { grid-template-columns: 1fr; gap: 8px; padding-block: 22px 16px; }
  .ix__head h2 { grid-column: auto; font-size: clamp(24px, 7.2vw, 30px); }
  .ix__head p { grid-column: auto; max-width: 34ch; }
  .ix__row { grid-template-columns: 36px 1fr 40px; grid-template-rows: auto auto; gap: 2px 8px; padding: 14px 0; font-size: 17px; }
  .ix__thumb { grid-column: 3; grid-row: 1 / span 2; align-self: center; width: 40px; height: 28px; }
  .ix__row:hover { padding-left: 0; }
  .ix__row .ix__num { grid-row: 1 / span 2; align-self: start; padding-top: 5px; }
  .ix__name { grid-column: 2; }
  .ix__type { grid-column: 2; display: block; font-size: 12px; line-height: 1.4; }
  .ix__count { display: none; }
  .ix__row--soon .ix__count { display: block; grid-column: 2; font-size: 12px; line-height: 1.4; color: var(--red); }
}
@media (prefers-reduced-motion: reduce) { .ix__row { transition: none; } }

/* Titre : lettrage en SVG (même cadre que l'accueil) */
.hero__logo { display: block; width: 5.05em; height: auto; margin: 0 auto; }
.hero__logo path { fill: currentColor; }

/* TEST : titres en Poppins Black minuscule */
.hero__title { font-family: "Poppins", var(--font-display); font-weight: 900; text-transform: lowercase; letter-spacing: -.045em; line-height: .92; font-size: clamp(44px, 14vw, 270px); }
.hero__line + .hero__line { margin-top: -.02em; }

/* Gros titres : Poppins Bold minuscule */

  font-family: "Poppins", var(--font-display);
  font-weight: 700;
  text-transform: lowercase;
  letter-spacing: -.04em;
}
.st-cta__title { font-size: clamp(40px, 8.2vw, 170px); }
.pg__hero .hero__script { top: .42em; left: 66%; width: 1.15em; transform: translateX(-50%) rotate(-1deg); }
.pg__hero .hero__script-text { font-family: "Reenie Beanie", cursive; }

/* Petites étiquettes : DM Mono partout */
:root { --font-mono: "DM Mono", ui-monospace, Menlo, monospace; }
.nav__mark, .hero__bar, .about__label, .service__num, .service__more, .contact__label, .contact__list,
.form__field label, .menu__links a i, .menu__foot small, .footer, .legal__label, .legal__update,
.pj__type, .pj__list dt, .ix__num, .st-plus {

  <script>
    // Icônes de contact : un clic ouvre le choix, un clic ailleurs ou Échap le ferme.
    (function () {
      var items = Array.prototype.slice.call(document.querySelectorAll('.quick__item'));

      function closeAll(except) {
        items.forEach(function (it) {
          if (it === except) return;
          it.classList.remove('is-open');
          it.querySelector('.quick__btn').setAttribute('aria-expanded', 'false');
        });
      }

      items.forEach(function (it) {
        var btn = it.querySelector('.quick__btn');
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          // sur téléphone, l'icône mail ouvre directement le choix du système (Mail, Gmail…), sans menu supplémentaire
          if (it.dataset.touchHref && window.matchMedia('(hover: none) and (pointer: coarse)').matches) {
            closeAll(null);
            window.location.href = it.dataset.touchHref;
            return;
          }
          var open = !it.classList.contains('is-open');
          closeAll(it);
          it.classList.toggle('is-open', open);
          btn.setAttribute('aria-expanded', open ? 'true' : 'false');
        });
      });

      document.addEventListener('click', function () { closeAll(null); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeAll(null); });
    })();
  </script>
  <script>
    // Menu mobile : le burger ouvre un plein écran avec les rubriques et les coordonnées.
    (function () {
      var btn = document.querySelector('.nav__burger');
      var menu = document.getElementById('menu');
      if (!btn || !menu) return;

      function set(open) {
        menu.classList.toggle('is-open', open);
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
        btn.setAttribute('aria-label', open ? 'Fermer le menu' : 'Ouvrir le menu');
        document.body.style.overflow = open ? 'hidden' : '';
        menu.setAttribute('aria-hidden', open ? 'false' : 'true');
      }

      btn.addEventListener('click', function () { set(!menu.classList.contains('is-open')); });
      menu.addEventListener('click', function (e) { if (e.target.closest('a')) set(false); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') set(false); });
      window.matchMedia('(min-width: 761px)').addEventListener('change', function (e) { if (e.matches) set(false); });
    })();
  </script>

        pj.classList.toggle('pj--flip', flipOn);
        v.style.backgroundImage = flipOn && d.flip.bg ? 'url("' + d.flip.bg + '")' : '';
        v.style.removeProperty('--fbw');
        if (!flipOn) return;
        document.getElementById('pjImgs').style.display = 'none';
        var P = d.flip.pages; fbN = P.length / 2; fbCur = 0; fbSheets = [];
        var h = '<div class="fb__stage" id="fbStage"><div class="fb__book is-start" id="fbBook">';
        for (var i = 0; i < fbN; i++) h += '<div class="fb__sheet"><div class="fb__face"><img src="' + esc(P[2 * i]) + '" alt="' + (i === 0 ? esc(d.title) + ' - couverture' : '') + '" decoding="async" draggable="false"></div><div class="fb__face fb__face--back"><img src="' + esc(P[2 * i + 1]) + '" alt="" decoding="async" draggable="false"></div></div>';
        h += '</div><button type="button" class="fb__zone fb__zone--prev" id="fbZPrev" aria-label="Page précédente" hidden></button><button type="button" class="fb__zone fb__zone--next" id="fbZNext" aria-label="Page suivante"></button></div>';
        h += '<div class="fb__ctrl"><button type="button" class="fb__btn" id="fbPrev" aria-label="Page précédente">' + FB_L + '</button><span class="fb__lbl" id="fbLbl" aria-live="polite"></span><button type="button" class="fb__btn" id="fbNext" aria-label="Page suivante">' + FB_R + '</button></div>';
        h += '<button type="button" class="fb__replay" id="fbReplay" hidden>↻ Revoir l’aperçu</button>';
        h += '<p class="fb__hint">' + (window.matchMedia('(hover: none)').matches ? 'Touchez ou glissez une page pour la tourner' : 'Cliquez ou glissez une page pour la tourner') + '</p>';
        var box = document.createElement('div'); box.className = 'fb'; box.id = 'fb'; box.innerHTML = h; v.appendChild(box);
        fbSheets = [].slice.call(box.querySelectorAll('.fb__sheet'));
        [['fbZNext', 1], ['fbZPrev', -1]].forEach(function (z) {
          var el = document.getElementById(z[0]);
          el.addEventListener('pointerdown', function (e) { fbDown(e, z[1]); });
          el.addEventListener('pointermove', fbMove); el.addEventListener('pointerup', fbUp); el.addEventListener('pointercancel', fbUp);
        });
        document.getElementById('fbNext').addEventListener('click', function () { fbStopDemo(); fbTurn(1); });
        document.getElementById('fbPrev').addEventListener('click', function () { fbStopDemo(); fbTurn(-1); });
        document.getElementById('fbReplay').addEventListener('click', fbStartDemo);
        fbRender(); fbSize();
        if ('ResizeObserver' in window) { fbRO = new ResizeObserver(fbSize); fbRO.observe(v); }
        requestAnimationFrame(fbSize);
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) document.getElementById('fbReplay').hidden = false; else fbStartDemo();
      }
      /* ---- Version mobile : défilement lent automatique à l'ouverture, stoppé dès que la personne la touche ---- */
      var phRaf = 0, phT = 0;
      function phoneStop() { cancelAnimationFrame(phRaf); clearTimeout(phT); phRaf = 0; }
      function phoneAuto() {
        phoneStop();
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        var sc = document.querySelector('#pjPhone .pj__phoneScreen'); if (!sc) return;
        var im = sc.querySelector('img'), stop = function () { phoneStop(); }, pos = 0, last = 0;
        ['pointerdown', 'touchstart', 'wheel'].forEach(function (ev) { sc.addEventListener(ev, stop, { passive: true, once: true }); });
        sc.addEventListener('mousemove', function mm(e) { if (e.movementX || e.movementY) { stop(); sc.removeEventListener('mousemove', mm); } }, { passive: true });
        function step(ts) {
          if (!last) last = ts;
          var dt = Math.min(ts - last, 50); last = ts;
          var max = sc.scrollHeight - sc.clientHeight;
          if (max <= 0) { phRaf = requestAnimationFrame(step); return; }
          pos += dt * 0.08;                         // ≈ 80 px / seconde
          if (pos >= max) { sc.scrollTop = max; phRaf = 0; return; }
          sc.scrollTop = pos; phRaf = requestAnimationFrame(step);
        }
        var go = function () { phT = setTimeout(function () { phRaf = requestAnimationFrame(step); }, 150); };
        if (im && !im.complete) { im.addEventListener('load', go, { once: true }); im.addEventListener('error', go, { once: true }); } else go();
      }
      function fill(it) {
        var d = it.detail;
        phoneStop();
        var win = document.getElementById('pjWin');
        win.className = 'pj__win' + (d.browser ? '' : ' pj__win--img');
        var viewer = document.getElementById('pjViewer');
        viewer.classList.toggle('pj__viewer--duo', !!d.mobile);
        var imgTag = function (u, alt) { return '<img src="' + esc(u) + '" alt="' + esc(alt) + '" decoding="async" onload="this.classList.add(\'is-in\')" onerror="this.classList.add(\'is-in\')">'; };
        document.getElementById('pjImgs').innerHTML = (d.imgs || [it.full || it.src]).map(function (u) { return imgTag(u, d.title); }).join('');
        buildBook(d);
        buildFlip(d);
        var oldPh = document.getElementById('pjPhone'); if (oldPh) oldPh.remove();
        if (d.mobile) { var ph = document.createElement('div'); ph.className = 'pj__phone'; ph.id = 'pjPhone'; ph.innerHTML = '<div class="pj__phoneFrame"><div class="pj__phoneScreen">' + imgTag(d.mobile, d.title + ' - version mobile') + '</div></div>'; viewer.appendChild(ph); phoneAuto(); }
        var oldMk = document.getElementById('pjMockup'); if (oldMk) oldMk.remove();
        if (d.mockup) { var mk = document.createElement('div'); mk.className = 'pj__mockup'; mk.id = 'pjMockup'; mk.innerHTML = imgTag(d.mockup, d.title + ' - en situation'); viewer.appendChild(mk); }
        document.getElementById('pjType').textContent = d.type;
        document.getElementById('pjTitle').textContent = d.title;
        document.getElementById('pjDesc').textContent = d.desc;
        document.getElementById('pjList').innerHTML = '<div><dt>Mission</dt><dd>' + d.items.map(esc).join(' · ') + '</dd></div><div><dt>Outils</dt><dd>' + esc(d.tools) + '</dd></div><div><dt>Format</dt><dd>' + esc(d.format) + '</dd></div>';
        document.getElementById('pjViewer').scrollTop = 0;
        document.querySelector('.pj__info').scrollTop = 0;
        document.getElementById('pjCount').textContent = list.length > 1 ? (idx + 1) + ' / ' + list.length : '';
        document.getElementById('pjNav').style.visibility = list.length > 1 ? '' : 'hidden';
        warm(idx + 1); warm(idx - 1);
      }
      function buildList() {
        var seen = {}, out = [];
        (window.__pjAll || []).forEach(function (x) { if (x && x.detail && !x.soon && !seen[x.detail.title]) { seen[x.detail.title] = 1; out.push(x); } });
        return out;
      }
      window.openProject = function (it) {
        if (!it || !it.detail) return;
        last = document.activeElement;
        list = buildList();
        idx = -1;
        list.forEach(function (x, i) { if (idx < 0 && x.detail.title === it.detail.title) idx = i; });
        if (idx < 0) { list = [it]; idx = 0; }
        cur = list[idx];
        fill(it);
        pj.classList.add('is-on'); document.documentElement.style.overflow = 'hidden';
        requestAnimationFrame(function () { pj.classList.add('is-show'); });
        document.getElementById('pjClose').focus({ preventScroll: true });
        document.querySelector('.pj__info').scrollTop = 0; document.getElementById('pjViewer').scrollTop = 0;
      };
      var panel = pj.querySelector('.pj__panel'), animT = 0;
      function go(dir) {
        if (list.length < 2) return;
        idx = (idx + dir + list.length) % list.length;
        cur = list[idx];
        panel.classList.remove('is-next', 'is-prev');
        void panel.offsetWidth;
        fill(cur);
        panel.classList.add(dir > 0 ? 'is-next' : 'is-prev');
        clearTimeout(animT); animT = setTimeout(function () { panel.classList.remove('is-next', 'is-prev'); }, 360);
      }
      document.getElementById('pjPrev').addEventListener('click', function () { go(-1); });
      document.getElementById('pjNext').addEventListener('click', function () { go(1); });
      var sx = 0, sy = 0, st = 0;
      panel.addEventListener('touchstart', function (e) { if (e.touches.length !== 1) return; sx = e.touches[0].clientX; sy = e.touches[0].clientY; st = Date.now(); }, { passive: true });
      panel.addEventListener('touchend', function (e) {
        if (!st || !e.changedTouches.length) return;
        var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; st = 0;
        if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.6) { if (bookOn) bkStep(dx < 0 ? 1 : -1); else if (!flipOn) go(dx < 0 ? 1 : -1); }
      }, { passive: true });
      document.addEventListener('keydown', function (e) {
        if (!pj.classList.contains('is-on')) return;
        if (flipOn) { if (e.key === 'ArrowRight') { fbStopDemo(); fbTurn(1); } else if (e.key === 'ArrowLeft') { fbStopDemo(); fbTurn(-1); } return; }
        if (bookOn) { if (e.key === 'ArrowRight') bkStep(1); else if (e.key === 'ArrowLeft') bkStep(-1); return; }
        if (e.key === 'ArrowRight') go(1); else if (e.key === 'ArrowLeft') go(-1);
      });
      function close() {
        pj.classList.remove('is-show'); document.documentElement.style.overflow = ''; fbStopAll(); phoneStop();
        setTimeout(function () { pj.classList.remove('is-on'); }, 300);
        if (last && last.focus) try { last.focus(); } catch (e) {}
      }
      document.getElementById('pjClose').addEventListener('click', close);
      document.getElementById('pjCta').addEventListener('click', close);
      pj.addEventListener('click', function (e) { if (e.target === pj) close(); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && pj.classList.contains('is-on')) close(); });
    })();
  </script>

  <script>
    // Lettrage manuscrit : coups de feutre, rejoués à chaque survol (même animation que l'accueil).
    (function () {
      var NS = 'http://www.w3.org/2000/svg';
      var W = 100, STEP = .24, DUR = .3, LEGS = 6;
      var svg = document.querySelector('.hero__script');
      var g = svg.querySelector('.pen-strokes');
      var top = +g.dataset.top, bot = +g.dataset.bot;
      var segs = g.dataset.segs.split(',').map(Number);
      segs.forEach(function (x, i) {
        var d = 'M' + x + ',' + top;
        for (var k = 1; k <= LEGS; k++) d += ' L' + (x + W * k / LEGS).toFixed(1) + ',' + (k % 2 ? bot : top);
        var p = document.createElementNS(NS, 'path');
        p.setAttribute('d', d); p.setAttribute('pathLength', '1'); p.style.setProperty('--d', (i * STEP).toFixed(2) + 's');
        g.appendChild(p);
      });
      var total = (segs.length - 1) * STEP + DUR, running = false;
      function play() {
        if (running) return; running = true;
        svg.classList.remove('is-drawing');
        requestAnimationFrame(function () { requestAnimationFrame(function () { svg.classList.add('is-drawing'); }); });
        setTimeout(function () { running = false; }, total * 1000 + 50);
      }
      svg.addEventListener('mouseenter', play); svg.addEventListener('click', play);
      setTimeout(play, 350);
    })();
  </script>
  <script>
    // Protection des images : pas de clic droit, pas de glisser-déposer, pas d'appui long « enregistrer l'image ».
    (function () {
      function isImage(t) {
        return t && t.closest && (t.closest('img') || t.closest('.trail__card') || t.closest('.pj__viewer') || t.closest('.follow') || t.closest('svg'));
      }
      document.addEventListener('contextmenu', function (e) { if (isImage(e.target)) e.preventDefault(); });
      document.addEventListener('dragstart', function (e) { if (e.target && e.target.tagName === 'IMG') e.preventDefault(); });
      function lock(root) {
        (root.querySelectorAll ? root.querySelectorAll('img') : []).forEach(function (im) { im.setAttribute('draggable', 'false'); });
      }
      lock(document);
      new MutationObserver(function (m) { m.forEach(function (r) { r.addedNodes.forEach(function (n) { if (n.nodeType === 1) { if (n.tagName === 'IMG') n.setAttribute('draggable', 'false'); else lock(n); } }); }); }).observe(document.body, { childList: true, subtree: true });
    })();
  </script>
