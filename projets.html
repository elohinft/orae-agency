/* ORAE — NEW ERA
   Valeurs issues de la maquette Figma (cadre 1440 px). */

:root {
  --bg: #f4f4f0;
  --ink: #0a0a0a;
  --ink-soft: rgba(0, 0, 0, .7);
  --red: #f70010;

  --font-text: "Inter", system-ui, sans-serif;
  --font-body: "Urbanist", "Inter", system-ui, sans-serif;
  --font-display: Helvetica, "Helvetica Neue", Arial, sans-serif;

  --edge: 12px;                          /* marge nav / footer */
  --gutter: clamp(20px, 5vw, 72px);      /* marge du contenu */
}

*,
*::before,
*::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-text);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

main { flex: 1; }

p, h1, h2, h3, ul { margin: 0; }
ul { padding: 0; list-style: none; }

a { color: inherit; text-decoration: none; }
a:hover { opacity: .6; }
a:focus-visible { outline: 1px solid currentColor; outline-offset: 3px; }

/* ---------- Navigation ---------- */

.nav {
  height: 52px;
  margin: 0 var(--edge);
  padding: 0 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: #000;
  white-space: nowrap;
}

.nav__brand { display: flex; align-items: center; gap: 8px; }
.nav__wordmark { font-size: 13px; font-weight: 700; }
.nav__mark { font-size: 11px; color: var(--ink-soft); }

.nav__menu {
  display: flex;
  align-items: center;
  gap: clamp(14px, 2.78vw, 40px);
  font-size: 13px;
  font-weight: 500;
}


.roll {
  display: block;
  overflow: hidden;
  height: 1.3em;
  line-height: 1.3em;
}

.roll > span {
  display: block;
  transition: transform .45s cubic-bezier(.6, 0, .2, 1);
}

a:hover .roll > span,
button:hover .roll > span { transform: translateY(-100%); }

/* ---------- Menu mobile (burger asymétrique) ---------- */

.nav__burger,
.menu { display: none; }

@media (max-width: 760px) {
  body { padding-top: 52px; }
  .about, .services, .contact, .trail { scroll-margin-top: 64px; }

  .nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 120;
    margin: 0;
    padding: 0 20px;
    background: var(--bg);
  }

  .nav__menu { display: none; }

  .nav__burger {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    justify-content: center;
    gap: 5px;
    width: 40px;
    height: 40px;
    margin-right: -8px;
    padding: 0 8px;
    border: 0;
    background: none;
    cursor: pointer;
  }

  .nav__burger span {
    display: block;
    height: 1.5px;
    border-radius: 1px;
    background: var(--ink);
    transition: transform .4s cubic-bezier(.6, 0, .2, 1), width .4s cubic-bezier(.6, 0, .2, 1), opacity .3s;
  }

  .nav__burger span:nth-child(1) { width: 22px; }
  .nav__burger span:nth-child(2) { width: 12px; }
  .nav__burger span:nth-child(3) { width: 17px; }

  .nav__burger[aria-expanded="true"] span:nth-child(1) { width: 20px; transform: translateY(6.5px) rotate(45deg); }
  .nav__burger[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
  .nav__burger[aria-expanded="true"] span:nth-child(3) { width: 20px; transform: translateY(-6.5px) rotate(-45deg); }

  .menu {
    position: fixed;
    inset: 0;
    z-index: 110;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 84px 24px 34px;
    background: var(--bg);
    visibility: hidden;
    clip-path: inset(0 0 100% 0);
    transition: clip-path .6s cubic-bezier(.7, 0, .2, 1), visibility 0s .6s;
  }

  .menu.is-open {
    visibility: visible;
    clip-path: inset(0 0 0 0);
    transition: clip-path .6s cubic-bezier(.7, 0, .2, 1), visibility 0s;
  }

  .menu__links { display: flex; flex-direction: column; border-top: 1px solid rgba(0, 0, 0, .18); }

  .menu__links a {
    display: flex;
    align-items: baseline;
    gap: 16px;
    padding: 18px 0 20px;
    border-bottom: 1px solid rgba(0, 0, 0, .18);
    font-family: var(--font-display);
    font-size: clamp(28px, 8.4vw, 42px);
    font-weight: 700;
    line-height: 1.05;
    letter-spacing: -.03em;
    opacity: 0;
    transform: translateY(18px);
    transition: opacity .45s, transform .6s cubic-bezier(.3, 1, .4, 1);
  }

  .menu__links a i {
    font-family: var(--font-text);
    font-size: 11px;
    font-style: normal;
    font-weight: 500;
    letter-spacing: 0;
    color: var(--ink-soft);
  }

  .menu.is-open .menu__links a { opacity: 1; transform: none; }
  .menu.is-open .menu__links a:nth-child(1) { transition-delay: .18s; }
  .menu.is-open .menu__links a:nth-child(2) { transition-delay: .24s; }
  .menu.is-open .menu__links a:nth-child(3) { transition-delay: .30s; }
  .menu.is-open .menu__links a:nth-child(4) { transition-delay: .36s; }

  .menu__links a:hover,
  .menu__foot a:hover { opacity: 1; }
  .menu__links a:active { color: var(--red); }

  .menu__foot {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding-top: 22px;
    border-top: 1px solid rgba(0, 0, 0, .2);
    font-size: 15px;
    font-weight: 500;
    opacity: 0;
    transition: opacity .4s;
  }

  .menu.is-open .menu__foot { opacity: 1; transition-delay: .45s; }
  .menu__foot small { margin-top: 10px; font-size: 11px; font-weight: 500; text-transform: uppercase; color: var(--ink-soft); }
}

@media (prefers-reduced-motion: reduce) {
  .menu, .menu__links a, .menu__foot, .nav__burger span { transition: none; }
}

/* ---------- Footer ---------- */

.footer {
  height: 52px;
  margin: 0 var(--edge) 30px;
  padding: 0 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11px;
  color: var(--ink-soft);
  white-space: nowrap;
}

.footer__legal { display: flex; gap: 24px; }

/* ---------- Contact rapide (icônes verticales) ---------- */

.quick {
  position: fixed;
  left: 50%;
  bottom: 20px;
  z-index: 60;
  display: flex;
  flex-direction: row;
  gap: 14px;
  transform: translateX(-50%);
}

.quick__item { position: relative; }

.quick__btn {
  width: 48px;
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: var(--ink);
  color: #fff;
  cursor: pointer;
  transition: transform .35s cubic-bezier(.3, 1.4, .4, 1), background .3s;
}

.quick__btn:hover { transform: scale(1.08); }
.quick__btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.quick__btn[aria-expanded="true"] { background: #333; }

.quick__btn svg {
  width: 22px;
  height: 22px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2.2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.quick__menu {
  position: absolute;
  left: 50%;
  bottom: 60px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 6px;
  border-radius: 22px;
  background: var(--ink);
  opacity: 0;
  visibility: hidden;
  transform: translate(-50%, 10px) scale(.96);
  transform-origin: center bottom;
  transition: opacity .25s, transform .35s cubic-bezier(.3, 1.3, .4, 1), visibility .25s;
}

.quick__item.is-open .quick__menu {
  opacity: 1;
  visibility: visible;
  transform: translate(-50%, 0) scale(1);
}

.quick__menu a {
  display: block;
  padding: 11px 20px;
  border-radius: 999px;
  color: #fff;
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
  transition: background .25s;
}

.quick__menu a:hover { opacity: 1; background: rgba(255, 255, 255, .16); }

@media (max-width: 640px) {
  .quick { bottom: 14px; }
  .quick__btn { width: 44px; height: 44px; }
  .quick__menu { bottom: 54px; }
}

@media (prefers-reduced-motion: reduce) {
  .quick__btn, .quick__menu { transition: none; }
}

/* fenêtre de détail d'un projet */
.pj { position: fixed; inset: 0; z-index: 1000; display: none; align-items: center; justify-content: center; padding: clamp(12px, 3vw, 32px); background: rgba(0, 0, 0, .86); opacity: 0; transition: opacity .3s; }
.pj.is-on { display: flex; }
.pj.is-show { opacity: 1; }
.pj__panel { position: relative; display: grid; grid-template-columns: 1.1fr 1fr; width: min(1080px, 100%); height: min(660px, 100%); background: #0d0d0d; color: #f4f4f0; border-radius: 6px; overflow: hidden; transform: translateY(14px) scale(.98); transition: transform .35s cubic-bezier(.2, .9, .3, 1); }
.pj.is-show .pj__panel { transform: none; }
.pj__viewer { min-height: 0; overflow-y: auto; padding: 16px; background: #181818; overscroll-behavior: contain; }
.pj__win { overflow: hidden; border-radius: 6px; background: #fff; }
.pj__bar { display: flex; align-items: center; gap: 5px; height: 24px; padding: 0 10px; background: #2a2a2a; }
.pj__bar i { width: 7px; height: 7px; border-radius: 50%; background: #5a5a5a; }
.pj__win--img .pj__bar { display: none; }
.pj__win--img { display: flex; flex-direction: column; gap: 12px; background: transparent; }
.pj__win--img #pjImgs { display: flex; flex-direction: column; gap: 12px; }
.pj__win--img img { border-radius: 4px; }
.pj__viewer img { display: block; width: 100%; height: auto; }
.pj__info { display: flex; flex-direction: column; gap: 20px; min-height: 0; overflow-y: auto; padding: 44px 40px 36px; }
.pj__type { margin: 0; font-size: 11px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: rgba(244, 244, 240, .55); }
.pj__title { margin: 0; font-family: var(--font-display); font-size: clamp(28px, 3.2vw, 38px); font-weight: 600; line-height: 1.05; letter-spacing: -.02em; }
.pj__desc { margin: 0; font-size: 14px; line-height: 1.65; color: rgba(244, 244, 240, .8); }
.pj__list { margin: 0; border-top: 1px solid rgba(244, 244, 240, .18); }
.pj__list div { display: grid; grid-template-columns: 100px 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px solid rgba(244, 244, 240, .18); font-size: 13px; }
.pj__list dt { color: rgba(244, 244, 240, .55); }
.pj__list dd { margin: 0; }
.pj__cta { align-self: flex-start; margin-top: auto; padding: 12px 20px; border-radius: 99px; background: #f4f4f0; color: #0a0a0a; font-size: 13px; font-weight: 500; text-decoration: none; }
.pj__close:focus, .pj__close:focus-visible { outline: none; box-shadow: none; }
.pj__close { -webkit-tap-highlight-color: transparent; position: absolute; top: 12px; right: 12px; z-index: 3; width: 34px; height: 34px; border: 0; border-radius: 50%; background: #f4f4f0; color: #0a0a0a; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; }
@media (max-width: 760px) {
  .pj__panel { grid-template-columns: 1fr; grid-template-rows: 42% 1fr; }
  .pj__info { padding: 22px 20px; gap: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  .roll > span { transition: none; }
  html { scroll-behavior: auto; }
}

.hero__title {
  /* Tout le bloc titre est dimensionné en em : 1em = 178 px sur 1440 */
  position: relative;
  margin: clamp(72px, 9.1vw, 175px) var(--gutter) 0;
  font-family: var(--font-display);
  font-size: clamp(40px, 12.361vw, 238px);
  font-weight: 700;
  line-height: .9;
  text-align: center;
}

.hero__line { display: block; white-space: nowrap; }
.hero__line + .hero__line { margin-top: -.0955em; }

.hero__script {
  position: absolute;
  left: 50%;
  top: 1.44em;
  width: 4.118em;                        /* 660 unités = .624em × 6.6 */
  height: auto;
  transform: translateX(-50%);
  overflow: visible;
  cursor: pointer;
}

.hero__script-text { fill: var(--red); }

/* Coups de feutre : chaque trait révèle le lettrage, bord net, sans fondu */
.pen-strokes path {
  stroke-dasharray: 1 2;
  stroke-dashoffset: 1;
}

.is-drawing .pen-strokes path {
  animation: stroke .26s var(--d, 0s) cubic-bezier(.3, .6, .4, 1) forwards;
}

@keyframes stroke { to { stroke-dashoffset: 0; } }

/* Boutons de contact : inversés pour rester lisibles sur fond sombre */
.quick__btn { background: #f4f4f0; color: #0a0a0a; }
.quick__btn:focus-visible { outline-color: #f4f4f0; }
.quick__btn[aria-expanded="true"] { background: #d9d9d3; }
.quick__menu { background: #f4f4f0; }
.quick__menu a { color: #0a0a0a; }
.quick__menu a:hover { background: rgba(0, 0, 0, .08); }

/* Fenêtre de détail en clair sur la page sombre */
.pj { background: rgba(0, 0, 0, .7); }
.pj__panel { background: #f4f4f0; color: #0a0a0a; }
.pj__viewer { background: #e8e8e3; }
.pj__bar { background: #dcdcd6; }
.pj__bar i { background: #b9b9b2; }
.pj__type { color: rgba(10, 10, 10, .55); }
.pj__desc { color: rgba(10, 10, 10, .78); }
.pj__list { border-top-color: rgba(10, 10, 10, .18); }
.pj__list div { border-bottom-color: rgba(10, 10, 10, .18); }
.pj__list dt { color: rgba(10, 10, 10, .55); }
.pj__cta { background: #0a0a0a; color: #f4f4f0; }
.pj__close { background: #0a0a0a; color: #f4f4f0; }

/* ---------- Page Projets (fond sombre) ---------- */
:root { --bg: #0b0b0b; --ink: #f4f4f0; --ink-soft: rgba(244, 244, 240, .6); --line: rgba(244, 244, 240, .16); }
body { background: var(--bg); color: var(--ink); }
.nav { color: var(--ink); }
.nav__brand, .nav__menu a { color: var(--ink); }
.footer, .footer a { color: var(--ink); }
.pg__hero { padding-bottom: clamp(40px, 6vw, 90px); }
.pg__hero .hero__title { margin-top: clamp(72px, 9.1vw, 175px); }
.pg__label { font-size: 11px; font-weight: 500; line-height: 15px; text-transform: uppercase; color: var(--ink-soft); }
.pg__label--r { text-align: right; }
.pg__title { font-family: var(--font-display); font-size: clamp(54px, 13vw, 200px); font-weight: 500; line-height: .9; letter-spacing: -.045em; }
.pg__jump { margin: 0 var(--gutter) 40px; justify-content: center; display: flex; flex-wrap: wrap; gap: 8px 24px; font-size: 13px; }
.pg__jump a { color: var(--ink-soft); border-bottom: 1px solid transparent; }
.pg__jump a:hover { opacity: 1; color: var(--ink); border-color: var(--ink); }
.ix { margin: 0 var(--gutter); }
.ix__cat { margin-bottom: clamp(36px, 6vw, 84px); scroll-margin-top: 20px; }
.ix__head { border-top: 1px solid var(--line); padding-block: 22px 14px; display: grid; grid-template-columns: 90px 1fr minmax(0, 320px); gap: 12px 24px; align-items: baseline; }
.ix__head h2 { font-family: var(--font-display); font-weight: 500; font-size: clamp(30px, 5.4vw, 80px); letter-spacing: -.035em; line-height: 1; }
.ix__head p { font-size: 13px; line-height: 1.55; color: var(--ink-soft); }
.ix__row { width: 100%; display: grid; grid-template-columns: 90px 1.4fr 1fr 110px; gap: 12px; align-items: center; padding: 16px 0; border: 0; border-top: 1px solid var(--line); background: none; color: inherit; font: inherit; font-size: 15px; text-align: left; cursor: pointer; transition: padding .3s; }
.ix__row:hover, .ix__row:focus-visible { padding-left: 14px; outline: none; }
.ix__row:focus-visible .ix__name { text-decoration: underline; text-underline-offset: 5px; }
.ix__num { font-size: 11px; font-weight: 500; letter-spacing: .06em; color: var(--ink-soft); }
.ix__name { font-weight: 500; }
.ix__type, .ix__count { color: var(--ink-soft); }
.ix__cat > .ix__row:last-child { border-bottom: 1px solid var(--line); }
.follow { position: fixed; left: 0; top: 0; width: clamp(180px, 20vw, 280px); pointer-events: none; z-index: 40; opacity: 0; transition: opacity .2s; will-change: transform; }
.follow.on { opacity: 1; }
.follow img { display: block; width: 100%; height: auto; border-radius: 2px; }
@media (hover: none) { .follow { display: none; } .ix__row:hover { padding-left: 0; } }
@media (max-width: 760px) {
  .follow { display: none; }
  .pg__jump { gap: 6px 18px; font-size: 12px; margin-bottom: 28px; }
  .ix { margin: 0 var(--gutter); }
  .ix__head { grid-template-columns: 1fr; gap: 8px; padding-block: 22px 16px; }
  .ix__head .ix__num { display: block; }
  .ix__head h2 { font-size: clamp(34px, 10.5vw, 46px); }
  .ix__head p { grid-column: auto; max-width: 34ch; }
  .ix__row { grid-template-columns: 36px 1fr; grid-template-rows: auto auto; gap: 2px 8px; padding: 16px 0; font-size: 17px; }
  .ix__row:hover { padding-left: 0; }
  .ix__row .ix__num { grid-row: 1 / span 2; align-self: start; padding-top: 5px; }
  .ix__name { grid-column: 2; }
  .ix__type { grid-column: 2; display: block; font-size: 12px; line-height: 1.4; }
  .ix__count { display: none; }
}
@media (prefers-reduced-motion: reduce) { .ix__row { transition: none; } }
</style>

    (function () {
      var items = Array.prototype.slice.call(document.querySelectorAll('.quick__item'));

      function closeAll(except) {
        items.forEach(function (it) {
          if (it === except) return;
          it.classList.remove('is-open');
          it.querySelector('.quick__btn').setAttribute('aria-expanded', 'false');
        });
      }

      items.forEach(function (it) {
        var btn = it.querySelector('.quick__btn');
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          // sur téléphone, l'icône mail ouvre directement le choix du système (Mail, Gmail…), sans menu supplémentaire
          if (it.dataset.touchHref && window.matchMedia('(hover: none) and (pointer: coarse)').matches) {
            closeAll(null);
            window.location.href = it.dataset.touchHref;
            return;
          }
          var open = !it.classList.contains('is-open');
          closeAll(it);
          it.classList.toggle('is-open', open);
          btn.setAttribute('aria-expanded', open ? 'true' : 'false');
        });
      });

      document.addEventListener('click', function () { closeAll(null); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeAll(null); });
    })();

    (function () {

      if (!btn || !menu) return;

      function set(open) {
        menu.classList.toggle('is-open', open);
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
        btn.setAttribute('aria-label', open ? 'Fermer le menu' : 'Ouvrir le menu');
        document.body.style.overflow = open ? 'hidden' : '';
        menu.setAttribute('aria-hidden', open ? 'false' : 'true');
      }

      btn.addEventListener('click', function () { set(!menu.classList.contains('is-open')); });
      menu.addEventListener('click', function (e) { if (e.target.closest('a')) set(false); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') set(false); });
      window.matchMedia('(min-width: 761px)').addEventListener('change', function (e) { if (e.matches) set(false); });
